plugins { id 'com.android.application' version '8.7.3' }

android {
    namespace 'org.lsong.fluttercompat'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'org.lsong.fluttercompat'
        minSdk 26
        // Keep the validated API 35 target; newer API targets need device validation.
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError true }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    testImplementation 'junit:junit:4.13.2'
}
