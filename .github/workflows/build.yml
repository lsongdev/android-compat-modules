name: Build
on:
  push:
    branches: [main]
    tags: ['v*', '*-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint and check renderer arguments
        run: ./gradlew --no-daemon :flutter-render-compat:assembleRelease :flutter-render-compat:lintRelease :flutter-render-compat:testReleaseUnitTest
      - name: Package Magisk modules
        run: python3 scripts/package-magisk.py
      - name: Collect unsigned APK
        run: cp flutter-render-compat/build/outputs/apk/release/flutter-render-compat-release-unsigned.apk dist/flutter-render-compat-1.1.0-unsigned.apk
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: android-compat-modules
          path: dist/
          if-no-files-found: error
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            flutter-render-compat/build/reports/
            flutter-render-compat/build/test-results/
          if-no-files-found: ignore
